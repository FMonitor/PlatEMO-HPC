<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PlatEMO HPC Master</title>
<style>body{max-width:1100px;margin:32px auto;font:15px system-ui;color:#18212b}section{margin:28px 0}form{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:8px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd5df;padding:7px;text-align:left}code{font-size:12px}</style></head>
<body><h1>PlatEMO HPC Master</h1><p>Data: <code>{{ data_dir }}</code></p>
<section><h2>Workers</h2><form method="post" action="/api/workers"><input name="name" placeholder="Name" required><input name="url" placeholder="http://zerotier-ip:6001" required><input name="token" placeholder="Worker token (optional)"><button>Add worker</button></form>
<table><tr><th>Name</th><th>URL</th><th>ID</th></tr>{% for w in workers %}<tr><td>{{w.name}}</td><td>{{w.url}}</td><td><code>{{w.id}}</code></td></tr>{% endfor %}</table></section>
<section><h2>Create task</h2><form method="post" action="/api/tasks" enctype="multipart/form-data"><input name="worker_id" placeholder="Worker ID" required><input name="algorithm" placeholder="Algorithm, e.g. VRLFSEA" required><input name="problem" placeholder="Problem, e.g. SMOP5" required><input name="seeds" value="1,2,3,4"><input name="pool_size" type="number" value="2" min="1"><input name="settings" type="file" accept=".mat"><button>Dispatch</button></form></section>
<section><h2>Tasks</h2><table><tr><th>ID</th><th>State</th><th>Updated</th><th>Error</th></tr>{% for t in tasks %}<tr><td><code>{{t.id}}</code></td><td>{{t.state}}</td><td>{{t.updated_at}}</td><td>{{t.error}}</td></tr>{% endfor %}</table></section></body></html>
